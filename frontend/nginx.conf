server {
    listen 80;

    # Arquivos do site (index.html, style.css, script.js)
    location / {
        root /usr/share/nginx/html;
        index index.html;
    }

    # Tudo que começa com /api/ é repassado para o container da API
    location /api/ {
        proxy_pass http://api:5000;
    }
}
