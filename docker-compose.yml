# Mathdle - 3 serviços:
#   banco    -> PostgreSQL (guarda as funções do dia e as partidas)
#   api      -> nossa API em Python/Flask (lógica do jogo)  <- serviço próprio
#   frontend -> Nginx (serve a página e repassa /api/ para a API)
#
# Imagens fixadas por versão + digest (sha256) para builds reproduzíveis.

services:
  banco:
    image: postgres:16.16-trixie@sha256:dd2bf3ce2dc83a81674cf7f217fcfd8a5009a4b325dda5b843bfee82a06cff6f
    environment:
      POSTGRES_USER: mathdle
      POSTGRES_PASSWORD: mathdle
      POSTGRES_DB: mathdle
    volumes:
      - ./banco/init.sql:/docker-entrypoint-initdb.d/01-init.sql
      - ./banco/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql
      - dados_banco:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mathdle"]
      interval: 5s
      retries: 10

  api:
    build: ./api
    environment:
      DB_HOST: banco
      DB_USER: mathdle
      DB_PASSWORD: mathdle
      DB_NAME: mathdle
    depends_on:
      banco:
        condition: service_healthy

  frontend:
    image: nginx:1.31.8-alpine3.24@sha256:fed7e14be83cbd2661a75cdc5b872d936cf155d46c327084d30b8df19ae88d72
    ports:
      - "8080:80"
    volumes:
      - ./frontend:/usr/share/nginx/html
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - api

volumes:
  dados_banco: